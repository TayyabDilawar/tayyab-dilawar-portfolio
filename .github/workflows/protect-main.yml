name: Protect main

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-pull-request:
    name: require pull request
    runs-on: ubuntu-latest
    steps:
      - name: Verify commit came from a pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequests } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });

            const mergedToMain = pullRequests.filter(
              (pr) => pr.merged_at && pr.base.ref === "main"
            );

            if (mergedToMain.length === 0) {
              core.setFailed(
                "Direct pushes to main are not allowed. Open a pull request instead."
              );
            }
